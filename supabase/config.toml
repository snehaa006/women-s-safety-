# Minimal Supabase CLI config. Unlisted settings use the CLI defaults.
# Local stack: `supabase start`, then `supabase db reset` applies migrations and seed.sql.
project_id = "womens-safety"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/login"]
